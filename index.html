
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>地震篇</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
}

body {
  font-family: sans-serif;
}

#book {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  margin: 0;
}

.page {
  background: white;
  overflow: hidden;
}

.page video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: white;
}

.stf__parent {
  margin: 0 auto !important;
}

</style>
</head>

<body>

<div id="book">

  <div class="page">
    <video src="./page1.mp4"
      muted playsinline preload="auto"></video>
  </div>

  <div class="page">
    <video src="./page2.mp4"
      muted playsinline preload="auto"></video>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
const bookElement = document.getElementById("book");

const book = new St.PageFlip(bookElement, {
  width: 400,
  height: 560,
  size: "stretch",
  minWidth: 200,
  maxWidth: 2000,
  minHeight: 280,
  maxHeight: 2000,
  showCover: false,
  usePortrait: true,
  startPage: 0,
  drawShadow: true,
  flippingTime: 700,
  useMouseEvents: true,
  mobileScrollSupport: false,
  swipeDistance: 30
});

book.loadFromHTML(
  document.querySelectorAll("#book .page")
);

function playCurrentPage() {
  const currentIndex = book.getCurrentPageIndex();
  const pages = document.querySelectorAll("#book .page");

  pages.forEach((page, index) => {
    const video = page.querySelector("video");

    if (index === currentIndex) {
      video.play().catch(() => {});
    } else {
      video.pause();
      video.currentTime = 0;
    }
  });
}

book.on("flip", playCurrentPage);

book.on("init", playCurrentPage);

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight") {
    book.flipNext();
  }

  if (event.key === "ArrowLeft") {
    book.flipPrev();
  }
});

setTimeout(playCurrentPage, 1000);
</script>

</body>
</html>
