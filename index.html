
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title> </title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  position: fixed;
  inset: 0;
}

#book {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
}

.page {
  background: #000;
  overflow: hidden;
}

.page video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.stf__parent {
  margin: 0 !important;
}
</style>
</head>

<body>

<div id="book">
  <div class="page">
    <video src="./page1.mp4"
      muted playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div class="page">
    <video src="./page2.mp4"
      muted playsinline webkit-playsinline preload="auto"></video>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
const book = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 560,
    height: 315,
    size: "stretch",
    minWidth: 200,
    maxWidth: 3000,
    minHeight: 150,
    maxHeight: 2000,
    showCover: false,
    usePortrait: false,
    startPage: 0,
    flippingTime: 600,
    useMouseEvents: true,
    mobileScrollSupport: false,
    drawShadow: false,
    maxShadowOpacity: 0
  }
);

book.loadFromHTML(
  document.querySelectorAll("#book .page")
);

function playCurrentPage() {
  const current = book.getCurrentPageIndex();
  const pages = document.querySelectorAll("#book .page");

  pages.forEach((page, index) => {
    const video = page.querySelector("video");

    if (index === current) {
      video.play().catch(() => {});
    } else {
      video.pause();
      video.currentTime = 0;
    }
  });
}

book.on("flip", playCurrentPage);

book.on("init", playCurrentPage);

setTimeout(playCurrentPage, 800);
</script>

</body>
</html>
